<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Terminal</title>
  <link rel="stylesheet" href="css/dos-theme.css">
</head>
<body>
  <!-- ═══ Top Status Bar ═══ -->
  <div id="status-bar" class="status-bar">
    <span id="status-app-name">POS TERMINAL</span>
    <span id="status-info">
      <span id="status-user" class="hidden"></span>
      <span id="status-shift" class="hidden"></span>
      <span id="status-clock"></span>
    </span>
  </div>

  <!-- ═══ Main Content Area ═══ -->
  <div id="app-content" class="app-content">
    <!-- Screens will be rendered here -->
  </div>

  <!-- ═══ Bottom Function Key Bar ═══ -->
  <div id="fn-bar" class="fn-bar">
    <!-- Function keys will be rendered dynamically -->
  </div>

  <!-- ═══ Toast / Messages ═══ -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ═══ Modal Container ═══ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/components.js"></script>
  <script src="js/screens/login.js"></script>
  <script src="js/screens/main-menu.js"></script>
  <script src="js/screens/shift.js"></script>
  <script src="js/screens/cashier.js"></script>
  <script src="js/screens/products.js"></script>
  <script src="js/screens/receiving.js"></script>
  <script src="js/screens/reports.js"></script>
  <script src="js/screens/admin.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
